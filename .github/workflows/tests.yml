name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: the target is a public site, so drift shows up here first.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Dry run - verify every Gherkin step is matched
        run: npm run test:dry

      - name: Run suite
        run: npm test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
